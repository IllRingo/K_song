<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K-song计划</title>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --accent-color: #ff4d8d;
            --bg-dark: #0f0c29;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main);
            min-height: 100vh; padding-bottom: 90px; overflow-x: hidden; position: relative;
        }
        /* 动态背景 */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #3a1c5e); background-size: 400% 400%; animation: gradientFlow 15s ease infinite; }
        @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.3; z-index: -1; }
        .blob-1 { width: 300px; height: 300px; background: #ff4d8d; top: -50px; left: -50px; animation: blobMove 8s ease-in-out infinite alternate; }
        .blob-2 { width: 250px; height: 250px; background: #4d79ff; bottom: 10%; right: -50px; animation: blobMove 10s ease-in-out infinite alternate-reverse; }
        @keyframes blobMove { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 30px); } }

        .header { padding: 32px 20px 15px; text-align: center; }
        .header h1 { font-size: 24px; font-weight: 600; letter-spacing: 1px; margin-bottom: 6px; background: linear-gradient(to right, #fff, #ffb3c9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 13px; color: var(--text-sub); font-style: italic; }

        /* 控制栏：搜索 + 排序 */
        .controls { padding: 0 16px 16px; position: sticky; top: 0; z-index: 50; background: rgba(15, 12, 41, 0.6); backdrop-filter: blur(10px); }
        .search-box { width: 100%; padding: 10px 16px; border-radius: 20px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; outline: none; margin-bottom: 12px; }
        .sort-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .sort-bar::-webkit-scrollbar { display: none; }
        .sort-btn { flex-shrink: 0; padding: 6px 14px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid transparent; color: var(--text-sub); font-size: 12px; cursor: pointer; transition: 0.2s; }
        .sort-btn.active { background: rgba(255, 77, 141, 0.2); border-color: var(--accent-color); color: #fff; }

        .list-container { padding: 0 12px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }

        .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .song-title { font-size: 17px; font-weight: 600; line-height: 1.3; }
        .artist { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
        .tag { font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; flex-shrink: 0; align-self: center; }
        .tag-original { background: rgba(46, 125, 50, 0.3); color: #81c784; }
        .tag-cover { background: rgba(239, 108, 0, 0.3); color: #ffb74d; }

        .card-info { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.5; margin-bottom: 12px; }
        .info-row { display: flex; margin-bottom: 4px; }
        .info-label { color: var(--text-sub); margin-right: 6px; min-width: 60px; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .recommender { font-size: 11px; color: var(--text-sub); }
        
        /* 喜欢按钮 */
        .like-btn { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.05); border: none; padding: 6px 12px; border-radius: 20px; color: var(--text-sub); font-size: 13px; cursor: pointer; transition: 0.2s; }
        .like-btn:hover:not(:disabled) { background: rgba(255, 77, 141, 0.1); }
        .like-btn.liked { color: var(--accent-color); }
        .like-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .like-icon { font-size: 14px; }

        /* 底部悬浮操作栏 */
        .footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 12, 41, 0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--card-border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .btn-action { flex: 1; padding: 12px 0; border-radius: 24px; font-size: 14px; font-weight: 600; text-align: center; cursor: pointer; transition: transform 0.1s; border: none; }
        .btn-action:active { transform: scale(0.96); }
        .btn-recommend { background: rgba(255,255,255,0.1); color: #fff; margin-right: 10px; text-decoration: none; }
        .btn-copy { background: linear-gradient(135deg, #ff4d8d 0%, #ff6b6b 100%); color: white; box-shadow: 0 4px 15px rgba(255, 77, 141, 0.4); }

        .loading { text-align: center; padding: 60px 0; color: var(--text-sub); font-size: 14px; }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="header">
        <h1>K-song计划</h1>
        <p>用一首歌的时间，遇见懂你的声音</p>
    </div>

    <div class="controls">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 搜索歌名、歌手、推荐原因、场景..." oninput="filterSongs()">
        <div class="sort-bar">
            <button class="sort-btn active" data-sort="createdAt" onclick="sortSongs('createdAt')">推荐时间</button>
            <button class="sort-btn" data-sort="artist" onclick="sortSongs('artist')">歌手名</button>
            <button class="sort-btn" data-sort="name" onclick="sortSongs('name')">歌曲名</button>
            <button class="sort-btn" data-sort="likes" onclick="sortSongs('likes')">喜欢数</button>
        </div>
    </div>

    <div class="list-container" id="songList">
        <div class="loading">正在从云端拉取最新歌单...</div>
    </div>

    <div class="footer-bar">
        <a href="https://my.feishu.cn/share/base/form/shrcnMhCEPA4Lk3flCkGB8CgcQF" target="_blank" class="btn-action btn-recommend">✨ 我要推荐</a>
        <button class="btn-action btn-copy" onclick="copySongList()">📋 一键导入歌单</button>
    </div>

    <script>
        let globalSongs = [];
        let currentSort = 'createdAt';
        let currentSearch = '';
        let likedInSession = new Set(); // 用于记录当前页面会话中已经被点击过的歌曲ID

        async function loadData() {
            try {
                const res = await fetch('/api/songs');
                const result = await res.json();
                if (result.code === 0) {
                    globalSongs = result.data;
                    renderList();
                } else { throw new Error(result.msg); }
            } catch (error) {
                document.getElementById('songList').innerHTML = `<div class="loading" style="color:#ff4d8d;">加载失败: ${error.message}</div>`;
            }
        }

        function filterSongs() {
            currentSearch = document.getElementById('searchInput').value.toLowerCase();
            renderList();
        }

        function sortSongs(criteria) {
            currentSort = criteria;
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sort === criteria);
            });
            renderList();
        }

        function renderList() {
            const container = document.getElementById('songList');
            
            // 1. 搜索过滤
            let filtered = globalSongs.filter(song => {
                if (!currentSearch) return true;
                const haystack = `${song.name} ${song.artist} ${song.reason} ${song.scene} ${song.recommender}`.toLowerCase();
                return haystack.includes(currentSearch);
            });

            // 2. 排序
            filtered.sort((a, b) => {
                if (currentSort === 'createdAt') return b.createdAt - a.createdAt;
                if (currentSort === 'likes') return b.likes - a.likes;
                if (currentSort === 'artist') return a.artist.localeCompare(b.artist, 'zh');
                if (currentSort === 'name') return a.name.localeCompare(b.name, 'zh');
                return 0;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="loading">没有找到匹配的歌曲</div>';
                return;
            }

            container.innerHTML = filtered.map(song => {
                const tagClass = song.isOriginal === "原唱" ? "tag-original" : "tag-cover";
                const likedClass = song.likes > 0 ? "liked" : "";
                const isDisabled = likedInSession.has(song.id) ? "disabled" : ""; // 如果已点过赞，渲染为禁用状态
                
                return `
                    <div class="card">
                        <div class="card-head">
                            <div>
                                <div class="song-title">${song.name}</div>
                                <div class="artist">${song.artist}</div>
                            </div>
                            <span class="tag ${tagClass}">${song.isOriginal}</span>
                        </div>
                        <div class="card-info">
                            ${song.scene ? `<div class="info-row"><span class="info-label">适用场景</span><span>${song.scene}</span></div>` : ''}
                            ${song.reason ? `<div class="info-row"><span class="info-label">推荐原因</span><span>${song.reason}</span></div>` : ''}
                        </div>
                        <div class="card-footer">
                            <span class="recommender">—— 由 ${song.recommender} 推荐</span>
                            <button class="like-btn ${likedClass}" ${isDisabled} onclick="likeSong('${song.id}', this)">
                                <span class="like-icon">${song.likes > 0 ? '❤️' : '🤍'}</span>
                                <span class="like-count">${song.likes}</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 点赞功能 (限制每次进入页面只能点击一次)
        async function likeSong(recordId, btnElement) {
            if (btnElement.disabled) return; // 防连点拦截
            if (likedInSession.has(recordId)) return; // 已点过赞拦截

            btnElement.disabled = true; // 视觉上立即锁定按钮
            likedInSession.add(recordId); // 将ID加入本次会话的已点赞集合

            const countElement = btnElement.querySelector('.like-count');
            const iconElement = btnElement.querySelector('.like-icon');
            
            let currentCount = parseInt(countElement.innerText) || 0;
            // 乐观UI更新：立即变红+1
            countElement.innerText = currentCount + 1;
            iconElement.innerText = '❤️';
            btnElement.classList.add('liked');

            try {
                const res = await fetch('/api/like', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recordId: recordId })
                });
                const result = await res.json();
                
                if (result.code === 0) {
                    // 用服务端返回的真实数据覆盖本地
                    countElement.innerText = result.likes;
                    const songIndex = globalSongs.findIndex(s => s.id === recordId);
                    if (songIndex > -1) globalSongs[songIndex].likes = result.likes;
                } else {
                    throw new Error(result.msg);
                }
            } catch (error) {
                // 请求失败时的回滚逻辑
                countElement.innerText = currentCount;
                iconElement.innerText = currentCount > 0 ? '❤️' : '🤍';
                if (currentCount === 0) btnElement.classList.remove('liked');
                btnElement.disabled = false; // 解除锁定允许重试
                likedInSession.delete(recordId); // 从已点赞集合中移除
                alert('点赞失败: ' + error.message);
            }
        }

        // 导出格式：歌手《歌名》 多个歌手空格分隔
        function copySongList() {
            if (globalSongs.length === 0) return alert('歌单还在加载中...');
            
            const text = globalSongs.map(s => {
                let artists = s.artist.replace(/[,，、\/]+/g, ' ').trim();
                return `${artists}《${s.name}》`;
            }).join('\n');
            
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ 歌单已复制！\n\n请打开QQ音乐或网易云音乐，找到“导入外部歌单”功能，粘贴即可生成练歌列表。');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                alert('✅ 歌单已复制！');
            });
        }

        loadData();
    </script>
</body>
</html>
