<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K歌群专属歌单</title>
    <style>
        /* CSS 样式保持之前的美化版本 */
        :root { --primary-color: #ff5e5e; --bg-color: #f7f8fa; --card-bg: #fff; --text-main: #1a1a1a; --text-sub: #8a8a8a; --shadow: 0 4px 12px rgba(0,0,0,0.06); --shadow-hover: 0 8px 24px rgba(255,94,94,0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding: 16px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 16px 20px; background: linear-gradient(135deg, #fff 0%, #fff5f5 100%); border-radius: 16px; margin-bottom: 24px; box-shadow: var(--shadow); }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .action-bar { position: sticky; top: 10px; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .btn-copy { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 24px; font-size: 14px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .card-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .song-title { font-size: 18px; font-weight: 700; }
        .artist { font-size: 14px; color: var(--text-sub); margin-bottom: 12px; }
        .tag-original { font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .tag-original.yes { background: #e8f5e9; color: #2e7d32; }
        .tag-original.no { background: #fff3e0; color: #ef6c00; }
        .song-info { background: var(--bg-color); padding: 12px; border-radius: 8px; margin-bottom: 12px; flex-grow: 1; }
        .info-item { font-size: 13px; margin-bottom: 6px; }
        .version-note { font-size: 12px; color: #888; font-style: italic; margin-bottom: 12px; padding-left: 8px; border-left: 2px solid #ddd; }
        .platforms { display: flex; gap: 8px; margin-top: auto; }
        .platform-btn { flex: 1; text-align: center; text-decoration: none; color: white; padding: 8px 0; border-radius: 8px; font-size: 13px; }
        .btn-qq { background: #31c27c; }
        .btn-netease { background: #e60026; }
        .btn-kugou { background: #2ca2f9; }
        .loading { text-align: center; padding: 40px; color: var(--text-sub); }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 K歌群专属公共歌单</h1>
            <p>数据实时同步自飞书多维表格</p>
        </div>
        <div class="action-bar">
            <span>共收录 <strong id="songCount">...</strong> 首歌曲</span>
            <button class="btn-copy" onclick="copySongList()">📋 一键复制导入歌单</button>
        </div>
        <div class="grid" id="songGrid">
            <div class="loading">正在从飞书拉取最新歌单...</div>
        </div>
    </div>

    <script>
        // 飞书多维表格里“音乐平台”字段，我假设大家填的是文本，比如 "qq" 或 "netease,kugou"
        // 如果没有填，默认给全平台
        const platformConfig = {
            qq: { name: "QQ音乐", class: "btn-qq", url: (q) => `https://y.qq.com/n/ryqq/search?w=${q}` },
            netease: { name: "网易云", class: "btn-netease", url: (q) => `https://music.163.com/#/search/m/?s=${q}&type=1` },
            kugou: { name: "酷狗", class: "btn-kugou", url: (q) => `https://www.kugou.com/search.php?keyword=${q}` }
        };

        let globalSongList = [];

        // 页面加载时调用 Vercel 的 API 获取数据
        async function loadData() {
            try {
                // 注意这里的路径，部署后会被替换为你的 Vercel 域名
                const res = await fetch('/api/songs'); 
                const result = await res.json();
                
                if (result.code === 0) {
                    globalSongList = result.data;
                    renderCards();
                } else {
                    throw new Error(result.msg);
                }
            } catch (error) {
                document.getElementById('songGrid').innerHTML = `<div class="loading" style="color:red;">数据加载失败: ${error.message}</div>`;
            }
        }

        function renderCards() {
            const grid = document.getElementById('songGrid');
            document.getElementById('songCount').innerText = globalSongList.length;

            grid.innerHTML = globalSongList.map(song => {
                const query = encodeURIComponent(`${song.name} ${song.artist}`);
                const originalTag = song.isOriginal === "原唱" 
                    ? `<span class="tag-original yes">原唱</span>` 
                    : `<span class="tag-original no">翻唱</span>`;

                const sceneTag = song.scene ? `<span class="tag-scene" style="display:inline-block;font-size:12px;padding:2px 6px;background:#f0f1f3;border-radius:4px;">🏷️ ${song.scene}</span>` : '';
                const versionNote = song.versionNote ? `<div class="version-note">📝 ${song.versionNote}</div>` : '';

                // 解析平台字段，支持逗号分隔
                let platforms = song.platform ? song.platform.split(',').map(p => p.trim()) : ['qq', 'netease'];
                let platformBtns = platforms.map(p => {
                    const conf = platformConfig[p];
                    if (!conf) return '';
                    return `<a href="${conf.url(query)}" target="_blank" class="platform-btn ${conf.class}">${conf.name}</a>`;
                }).join('');

                return `
                    <div class="card">
                        <div class="card-head">
                            <div>
                                <div class="song-title">${song.name}</div>
                                <div class="artist">歌手：${song.artist}</div>
                            </div>
                            ${originalTag}
                        </div>
                        <div class="song-info">
                            <div class="info-item" style="margin-bottom:8px;">${sceneTag}</div>
                            <div class="info-item"><span style="color:#8a8a8a;">💡 推荐理由：</span>${song.reason || '暂无'}</div>
                        </div>
                        ${versionNote}
                        <div class="platforms">${platformBtns}</div>
                    </div>
                `;
            }).join('');
        }

        function copySongList() {
            if (globalSongList.length === 0) return alert('歌单还在加载中...');
            const textToCopy = globalSongList.map(s => `${s.name} - ${s.artist}`).join('\n');
            navigator.clipboard.writeText(textToCopy).then(() => alert('✅ 歌单已复制！\n请打开QQ音乐或网易云音乐，找到“导入外部歌单”功能，粘贴即可。'));
        }

        // 启动
        loadData();
    </script>
</body>
</html>
