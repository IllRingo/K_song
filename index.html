<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K歌群专属歌单</title>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --accent-color: #ff4d8d;
            --bg-dark: #0f0c29;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px; /* 给底部悬浮栏留空间 */
            overflow-x: hidden;
            position: relative;
        }

        /* 流线型动态背景层 */
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #3a1c5e);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 背景光晕装饰 */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
        }
        .blob-1 { width: 300px; height: 300px; background: #ff4d8d; top: -50px; left: -50px; animation: blobMove 8s ease-in-out infinite alternate; }
        .blob-2 { width: 250px; height: 250px; background: #4d79ff; bottom: 10%; right: -50px; animation: blobMove 10s ease-in-out infinite alternate-reverse; }
        @keyframes blobMove { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 30px); } }

        /* 顶部区域 */
        .header {
            padding: 32px 20px 20px;
            text-align: center;
        }
        .header h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; margin-bottom: 6px; }
        .header p { font-size: 12px; color: var(--text-sub); }

        /* 卡片列表容器 */
        .list-container {
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 单张卡片 - 毛玻璃效果 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            transition: transform 0.2s ease;
        }
        .card:active { transform: scale(0.98); }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .song-title { font-size: 17px; font-weight: 600; line-height: 1.3; }
        .artist { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
        
        .tag {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tag-original { background: rgba(46, 125, 50, 0.3); color: #81c784; border: 1px solid rgba(46, 125, 50, 0.5); }
        .tag-cover { background: rgba(239, 108, 0, 0.3); color: #ffb74d; border: 1px solid rgba(239, 108, 0, 0.5); }

        .card-info {
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            line-height: 1.5;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .info-row { display: flex; margin-bottom: 4px; }
        .info-label { color: var(--text-sub); margin-right: 6px; min-width: 60px; }
        
        .recommender { font-size: 11px; color: var(--text-sub); text-align: right; margin-bottom: 10px; }

        /* 听歌平台按钮 */
        .platforms { display: flex; gap: 8px; }
        .platform-btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: white;
            padding: 7px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .platform-btn:active { opacity: 0.7; }
        .btn-qq { background: rgba(49, 194, 124, 0.8); }
        .btn-netease { background: rgba(230, 0, 38, 0.8); }
        .btn-kugou { background: rgba(44, 162, 249, 0.8); }

        /* 底部悬浮操作栏 */
        .footer-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .footer-text { font-size: 13px; color: var(--text-sub); }
        .footer-text strong { color: var(--accent-color); }
        .btn-copy {
            background: linear-gradient(135deg, #ff4d8d 0%, #ff6b6b 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 141, 0.4);
        }

        .loading { text-align: center; padding: 60px 0; color: var(--text-sub); font-size: 14px; }
    </style>
</head>
<body>
    <!-- 动态背景元素 -->
    <div class="bg-animation"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="header">
        <h1>🎤 K歌群专属歌单</h1>
        <p>精选好曲，随时开唱</p>
    </div>

    <div class="list-container" id="songList">
        <div class="loading">正在从云端拉取最新歌单...</div>
    </div>

    <div class="footer-bar">
        <span class="footer-text">共 <strong id="songCount">0</strong> 首歌曲</span>
        <button class="btn-copy" onclick="copySongList()">📋 一键导入歌单</button>
    </div>

    <script>
        let globalSongs = [];

        async function loadData() {
            try {
                const res = await fetch('/api/songs');
                const result = await res.json();
                if (result.code === 0) {
                    globalSongs = result.data;
                    renderList();
                } else {
                    throw new Error(result.msg);
                }
            } catch (error) {
                document.getElementById('songList').innerHTML = `<div class="loading" style="color:#ff4d8d;">加载失败: ${error.message}<br>请检查飞书配置</div>`;
            }
        }

        function renderList() {
            const container = document.getElementById('songList');
            document.getElementById('songCount').innerText = globalSongs.length;

            if (globalSongs.length === 0) {
                container.innerHTML = '<div class="loading">暂无歌曲数据</div>';
                return;
            }

            container.innerHTML = globalSongs.map(song => {
                const query = encodeURIComponent(`${song.name} ${song.artist}`);
                const tagClass = song.isOriginal === "原唱" ? "tag-original" : "tag-cover";
                
                return `
                    <div class="card">
                        <div class="card-head">
                            <div>
                                <div class="song-title">${song.name}</div>
                                <div class="artist">${song.artist}</div>
                            </div>
                            <span class="tag ${tagClass}">${song.isOriginal}</span>
                        </div>
                        
                        <div class="card-info">
                            ${song.scene ? `<div class="info-row"><span class="info-label">适用场景</span><span>${song.scene}</span></div>` : ''}
                            ${song.reason ? `<div class="info-row"><span class="info-label">推荐理由</span><span>${song.reason}</span></div>` : ''}
                        </div>

                        <div class="recommender">—— 由 ${song.recommender} 推荐</div>

                        <div class="platforms">
                            <a href="https://y.qq.com/n/ryqq/search?w=${query}" target="_blank" class="platform-btn btn-qq">QQ音乐</a>
                            <a href="https://music.163.com/#/search/m/?s=${query}&type=1" target="_blank" class="platform-btn btn-netease">网易云</a>
                            <a href="https://www.kugou.com/search.php?keyword=${query}" target="_blank" class="platform-btn btn-kugou">酷狗</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function copySongList() {
            if (globalSongs.length === 0) return alert('歌单还在加载中...');
            const text = globalSongs.map(s => `${s.name} - ${s.artist}`).join('\n');
            
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ 歌单文本已复制！\n\n请打开QQ音乐或网易云音乐，找到“导入外部歌单”功能，粘贴即可生成你的专属练歌列表。');
            }).catch(() => {
                // 降级方案
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('✅ 歌单文本已复制！');
            });
        }

        loadData();
    </script>
</body>
</html>
